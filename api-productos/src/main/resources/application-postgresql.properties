# Perfil PostgreSQL - Reto 3 (persistencia externa, alternativa a MySQL)
# Activar con: --spring.profiles.active=postgres
#
# Antes de usarlo:
# 1. Instala PostgreSQL y crea la base de datos: CREATE DATABASE inventariodb;
# 2. Ajusta usuario/contraseña si son distintos a los de abajo.

spring.datasource.url=jdbc:postgresql://localhost:5432/inventariodb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# La consola H2 no aplica en este perfil
spring.h2.console.enabled=false
