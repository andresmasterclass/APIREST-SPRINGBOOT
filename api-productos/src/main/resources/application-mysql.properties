# Perfil MySQL - Reto 3 (persistencia externa)
# Activar con: --spring.profiles.active=mysql
#
# Antes de usarlo:
# 1. Instala MySQL y crea la base de datos: CREATE DATABASE inventariodb;
# 2. Ajusta usuario/contraseña si son distintos a los de abajo.

spring.datasource.url=jdbc:mysql://localhost:3306/inventariodb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root1234

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# La consola H2 no aplica en este perfil
spring.h2.console.enabled=false
